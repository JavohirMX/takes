name: ChessCamera
options:
  bundleIdPrefix: app.chesscamera
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    from: 0.17.0
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    from: 0.7.0
  OpenCV:
    url: https://github.com/yeatse/opencv-spm.git
    from: 5.0.0
targets:
  ChessCamera:
    type: application
    platform: iOS
    sources:
      - path: ChessCamera
        excludes:
          # Kept on disk for `uv run` reconvert; not loaded at runtime.
          - Resources/model.json
          - Resources/group1-shard1of1.bin
    dependencies:
      - package: ChessKit
        product: ChessKit
      - package: ChessKitEngine
        product: ChessKitEngine
      - package: OpenCV
        product: OpenCV
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        SWIFT_OBJC_BRIDGING_HEADER: ChessCamera/ChessCamera-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/ChessCamera $(SRCROOT)/ChessCamera/Vision/OpenCV
        PRODUCT_BUNDLE_IDENTIFIER: app.chesscamera.ChessCamera
        PRODUCT_NAME: ChessCamera
        PRODUCT_MODULE_NAME: ChessCamera
        INFOPLIST_KEY_CFBundleDisplayName: Takes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Takes watches the board to record your game.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import a recorded video to test the same pipeline.
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - ChessCameraTests
  ChessCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChessCameraTests
    dependencies:
      - target: ChessCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chesscamera.ChessCameraTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChessCamera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChessCamera"
        BUNDLE_LOADER: "$(TEST_HOST)"
